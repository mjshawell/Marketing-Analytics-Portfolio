project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "projects/*.qmd"
    - "!submission/"
    - "!data/"

website:
  title: "Mickyas Shawel | Portfolio"
  search: true

  navbar:
    left:
      - href: index.qmd
        text: Home

      - href: cep.qmd
        text: CEP Dashboard

      - href: customization.qmd
        text: CSS / SCSS

      - href: listings.qmd
        text: Listings

  page-footer:
    left: "Mickyas Shawel | Professional Portfolio"
